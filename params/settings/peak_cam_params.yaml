# Parameter file for camera_aravis2 (IDS cameras via GigE Vision / USB3 Vision).
# camera_aravis2 uses the Aravis library and exposes standard GenICam features
# as ROS 2 parameters.
#
# For details on all available parameters see:
#   https://github.com/FraunhoferIOSB/camera_aravis2
/**:
  ros__parameters:

    # GUID of the camera to open.
    # For IDS GigE cameras this is typically the serial number
    # (e.g. "4103929441") or a full Aravis GUID such as
    # "IDS-4103929441" or an IP address "192.168.1.100".
    # Leave empty ("") to open the first available camera.
    guid: "4103929441"

    # ROS frame ID used in all published messages
    frame_id: peak_cam

    # --- Image format ---

    # Requested image width (pixels)
    Width: 4000

    # Requested image height (pixels)
    Height: 3000

    # Pixel format.
    # Common values: "Mono8", "RGB8", "BGR8", "BayerRG8"
    PixelFormat: "Mono8"

    # --- Acquisition ---

    # Acquisition frame rate in Hz (float, must be > 0.0; camera hardware limits apply)
    AcquisitionFrameRate: 5.0

    # Exposure time in microseconds (float; only used when ExposureAuto is "Off")
    ExposureTime: 5000.0

    # Automatic exposure: "Off", "Once", "Continuous"
    ExposureAuto: "Continuous"

    # --- Gain ---

    # Automatic gain: "Off", "Once", "Continuous"
    GainAuto: "Continuous"

    # Gain selector (camera-specific).
    # Common values: "AnalogAll", "DigitalAll"
    GainSelector: "DigitalAll"

    # --- Image correction ---

    # Gamma correction factor [0.3 … 3.0]. Use 1.0 to disable.
    Gamma: 1.0

