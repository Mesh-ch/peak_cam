# In this parameter file you can change acquisition settings of the camera.
# Before that, you should try to open the camera with the ids_visioncockpit for
# an approximate setting.
#
# This ROS 2 node expects:
# - frame_id (old key: frame_name)
# - image_topic (old key: camera_topic)
#
# To add more parameters to your camera please view the IDS Vision Reference at
# https://de.ids-imaging.com/manuals-ids-peak.html
# and modify acquisition_parameters.hpp and setDeviceParameters() function in peak_cam class.
/**:
  ros__parameters:
    image_topic: image_raw
    frame_id: peak_cam

    # unique camera name for calibration and set_camera_info service (legacy note)
    # camera_name: peak_camera

    # choose which device to enter by entering its serial number here
    selectedDevice: "4103929441"

    # configure your desired image size
    # needs to be divisible by 8 and smaller than your imager size (Max Width, Max Height)
    ImageHeight: 2512
    ImageWidth: 3392

    # If UseOffset is false, image will be centered depending on image height/width.
    # If UseOffset is true, OffsetWidth and OffsetHeight are used directly.
    UseOffset: False
    OffsetWidth: 0
    OffsetHeight: 0

    # Pixel format
    # In IDS Implemented: ["Mono8", "Mono10", "Mono12", "Mono10p", "Mono12p", "BayerRG8", "BayerRG10", "BayerRG12", "BayerRG10p", "BayerRG12p", "RGB8", "RGB10p32", "BGR8", "BGR10p32"]
    # Currently supported in this node: ["Mono8", "RGB8", "BGR8"]
    PixelFormat: "Mono8"

    # DeviceLinkThroughputLimit (legacy note; currently not consumed by this node)
    # DeviceLinkThroughputLimit: 125000000

    # ExposureTime in us
    # limits the Acquisition Framerate
    # When ExposureAuto is set to "Once" or "Continuous" the value won't be used
    ExposureTime: 5000

    # Line1Source (legacy note; currently not consumed by this node)
    # Line1Source: "ExposureActive"

    # Trigger parameters (legacy note; currently not consumed by this node)
    # TriggerSource: "Off"
    # TriggerActivation: "RisingEdge"
    # TriggerDivider: 1

    # AcquisitionFrameRate in Hz
    # WATCH OUT when AcquisitionFrameRate is too high there might be latency.
    AcquisitionFrameRate: 5

    # Gamma
    # Range [0.3, ..., 3.0]
    # If no Gamma correction is needed set to 1.0
    Gamma: 1.0

    # ExposureAuto Setting
    # Possible: ["Off", "Once", "Continuous"]
    ExposureAuto: "Continuous"

    # GainAuto Setting
    # Possible: ["Off", "Once", "Continuous"]
    GainAuto: "Continuous"

    # GainSelector Setting
    # Possible: ["AnalogAllSource", "AnalogAll", "AnalogRed", "AnalogGreen", "AnalogBlue", "DigitalAll", "DigitalRed", "DigitalGreen", "DigitalBlue"]
    GainSelector: "DigitalAll"
